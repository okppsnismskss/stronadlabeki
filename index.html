
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Generator kodu</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    min-height: 100vh;
    display: grid;
    place-items: center;
    margin: 0;
}
.panel {
    background: #1c2940;
    padding: 35px;
    border-radius: 16px;
    text-align: center;
    width: 380px;
    box-shadow: 0 10px 40px #0005;
}
button {
    background: #39a7ff;
    color: #071421;
    border: none;
    border-radius: 10px;
    padding: 15px 24px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}
p { color: #c9d6e7; }
</style>
</head>
<body>
<div class="panel">
    <h1>Generator kodu</h1>
    <p>Kliknij, aby wygenerować kod połączenia.</p>
    <button onclick="generuj()">Wygeneruj kod</button>
    <button onclick="stop()">STOP</button>
    <p id="wynik"></p>
</div>

<script>
let timer = null;
let licznik = 0;

function generuj() {
    if (timer !== null) return;

    const kod = Math.floor(
        10000000 + Math.random() * 90000000
    );

    document.getElementById("wynik").textContent =
        "Twój kod: " + kod;

    licznik = 0;

    timer = setInterval(() => {
        if (licznik >= 10) {
            stop();
            return;
        }

        window.open("https://pl.google.com/", "_blank");
        licznik++;

        if (licznik >= 10) stop();
    }, 500);
}

function stop() {
    if (timer !== null) {
        clearInterval(timer);
        timer = null;
    }
}
</script>
</body>
</html>
